<svg class="architecture-diagram billing-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 750" width="720" height="750" aria-labelledby="billing-title billing-desc" preserveAspectRatio="xMidYMid meet">
  <title id="billing-title">Billing pipeline architecture</title>
  <desc id="billing-desc">Interactive stages show visit documentation flowing through an LLM code suggestion, a 21-rule deterministic post-processor, human review, an automated audit, two-phase submission, and finally a clearinghouse.</desc>
  <style>
    .billing-diagram {
      --diagram-text: #172321;
      --diagram-surface: #ffffff;
      --diagram-soft: #e8f5f2;
      --diagram-accent: #0a5f58;
      --diagram-flow-fallback: #607873;
      color: var(--text, var(--diagram-text));
    }

    @media (prefers-color-scheme: dark) {
      .billing-diagram {
        --diagram-text: #edf5f2;
        --diagram-surface: #151f1d;
        --diagram-soft: #153b37;
        --diagram-accent: #79eedb;
        --diagram-flow-fallback: #8fa7a1;
      }
    }

    .billing-diagram .billing-box {
      fill: var(--surface, var(--diagram-surface));
      stroke: currentColor;
      stroke-width: 2;
    }

    .billing-diagram .billing-emphasis {
      fill: var(--accent-soft, var(--diagram-soft));
      stroke: var(--accent-strong, var(--diagram-accent));
      stroke-width: 3;
    }

    .billing-diagram .billing-flow,
    .billing-diagram .billing-connector,
    .billing-diagram .billing-bracket {
      fill: none;
      stroke: var(--diagram-flow, var(--diagram-flow-fallback));
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .billing-diagram .billing-flow {
      stroke-width: 3;
      marker-end: url(#billing-arrow);
    }

    .billing-diagram .billing-connector,
    .billing-diagram .billing-bracket {
      stroke-width: 2;
    }

    .billing-diagram .billing-label {
      fill: currentColor;
      font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-anchor: middle;
      pointer-events: none;
    }

    .billing-diagram .billing-note {
      fill: var(--accent-strong, var(--diagram-accent));
      font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-anchor: middle;
    }

    .billing-diagram .billing-arrowhead {
      fill: var(--diagram-flow, var(--diagram-flow-fallback));
    }

    .billing-diagram .diagram-node {
      color: inherit;
      cursor: pointer;
      outline: none;
    }

    .billing-diagram .diagram-node:hover rect,
    .billing-diagram .diagram-node:focus-visible rect {
      fill: var(--accent-soft, var(--diagram-soft));
      stroke: var(--accent-strong, var(--diagram-accent));
      stroke-width: 4;
    }

    .billing-diagram .diagram-node:focus-visible {
      outline: 3px solid var(--accent, var(--diagram-accent));
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: no-preference) {
      .billing-diagram .billing-flow,
      .billing-diagram .billing-connector {
        stroke-dasharray: 8 10;
        animation: billing-flow-march 14s linear infinite;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .billing-diagram *,
      .billing-diagram *::before,
      .billing-diagram *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    @keyframes billing-flow-march {
      to { stroke-dashoffset: -36; }
    }
  </style>

  <defs>
    <marker id="billing-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="billing-arrowhead" d="M 1 1 L 9 5 L 1 9 z"></path>
    </marker>
  </defs>

  <a class="diagram-node billing-node n-1" href="/projects/billing-pipeline/#one-claim">
    <title>Visit documentation: the model's only input</title>
    <rect class="billing-box" x="210" y="30" width="300" height="80" rx="12"></rect>
    <text class="billing-label" x="360" y="78">Visit documentation</text>
  </a>

  <path class="billing-flow" d="M360 110 V125 H180 V140"></path>
  <a class="diagram-node billing-node n-2" href="/projects/billing-pipeline/#lessons">
    <title>LLM code suggestion: proposes procedure and diagnosis codes in 3-6 seconds</title>
    <rect class="billing-box" x="30" y="140" width="300" height="90" rx="12"></rect>
    <text class="billing-label" x="180" y="192">LLM code suggestion</text>
  </a>

  <path class="billing-flow" d="M330 185 H380"></path>
  <a class="diagram-node billing-node n-3" href="/projects/billing-pipeline/#outcome">
    <title>21-rule deterministic post-processor: where 22 miscoded claims were caught</title>
    <rect class="billing-box billing-emphasis" x="380" y="140" width="310" height="90" rx="12"></rect>
    <text class="billing-label" x="535" y="178">
      <tspan x="535" dy="0">21-rule deterministic</tspan>
      <tspan x="535" dy="25">post-processor</tspan>
    </text>
  </a>

  <path class="billing-bracket" d="M30 253 V265 H690 V253"></path>
  <text class="billing-note" x="360" y="292">never trusted directly</text>

  <path class="billing-flow" d="M535 230 V315 H360 V340"></path>
  <a class="diagram-node billing-node n-4" href="/projects/billing-pipeline/#one-claim">
    <title>Human review queue: a human approves every claim</title>
    <rect class="billing-box" x="210" y="340" width="300" height="80" rx="12"></rect>
    <text class="billing-label" x="360" y="388">Human review queue</text>
  </a>

  <path class="billing-flow" d="M360 420 V480"></path>
  <a class="diagram-node billing-node n-5" href="/projects/billing-pipeline/#architecture">
    <title>Two-phase submission: staged first, nothing goes straight out</title>
    <rect class="billing-box" x="210" y="480" width="300" height="80" rx="12"></rect>
    <text class="billing-label" x="360" y="528">Two-phase submission</text>
  </a>

  <a class="diagram-node billing-node n-6" href="/projects/billing-pipeline/#architecture">
    <title>Automated audit: final automated check before submission</title>
    <rect class="billing-box billing-emphasis" x="20" y="580" width="190" height="70" rx="12"></rect>
    <text class="billing-label" x="115" y="622">Automated audit</text>
  </a>
  <path class="billing-connector" d="M210 615 H360"></path>

  <path class="billing-flow" d="M360 560 V670"></path>
  <a class="diagram-node billing-node n-7" href="/projects/billing-pipeline/#outcome">
    <title>Clearinghouse: the approved claim goes out the door</title>
    <rect class="billing-box" x="210" y="670" width="300" height="70" rx="12"></rect>
    <text class="billing-label" x="360" y="712">Clearinghouse</text>
  </a>
</svg>
